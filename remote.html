<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1523">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>폰 리모컨 · 예배 스튜디오</title>
<link rel="icon" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/logo.png">
<link rel="stylesheet" href="css/studio.css">
</head>
<body class="remote">
<div class="gate" id="gate" hidden></div>

<div class="rm" id="app" hidden>
  <div class="rm-top">
    <span class="pill" id="disp">송출 화면 확인 중</span>
    <span class="pill" id="conn">연결 확인 중</span>
  </div>
  <div class="rm-now" id="now">불러오는 중…</div>
  <div class="rm-previews">
    <div><div class="cap">지금</div><div id="cur"></div></div>
    <div><div class="cap">다음</div><div id="next"></div></div>
  </div>
  <div class="rm-secs" id="secs" aria-label="순서 바로가기"></div>
  <div style="display:grid; gap:10px">
    <div class="rm-modes">
      <button class="btn" id="m-black">검은 화면</button>
      <button class="btn" id="m-logo">교회 로고</button>
    </div>
    <div class="rm-pad">
      <button class="btn" id="prev" aria-label="이전">◀</button>
      <button class="btn next" id="nextbtn" aria-label="다음">다음 ▶</button>
    </div>
  </div>
</div>

<script type="module">
import { requireLogin } from "./js/firebase.js";
import { mountStage, slideLabel } from "./js/render.js";
import { watchDeck, expandItems, sectionsOf } from "./js/deck.js";
import { createLive, clamp, keepAwake, watchDisplayPresence } from "./js/live.js";

const $ = (id) => document.getElementById(id);
const buzz = () => { try { navigator.vibrate && navigator.vibrate(15); } catch (e) {} };

requireLogin($("gate"), () => {
  $("app").hidden = false;
  const live = createLive({ canWrite: true, who: "remote-" + Math.random().toString(36).slice(2, 7) });
  const drawCur = mountStage($("cur"));
  const drawNext = mountStage($("next"));
  let slides = [], deckId = null, unwatch = null;

  function render() {
    const s = live.state;
    const i = clamp(s.index || 0, 0, Math.max(0, slides.length - 1));
    drawCur(s.mode === "black" ? { type: "black" } : s.mode === "logo" ? { type: "logo" } : slides[i]);
    drawNext(slides[i + 1] || { type: "black" });
    $("now").innerHTML = slides.length
      ? `${(s.mode === "slide" ? slideLabel(slides[i]) : s.mode === "black" ? "검은 화면 송출 중" : "교회 로고 송출 중").replace(/</g, "&lt;")}<small>${i + 1} / ${slides.length} · ${deckId || ""}</small>`
      : "송출할 예배가 없습니다.<small>PC 발표자 화면에서 예배를 먼저 불러와 주세요.</small>";
    $("m-black").classList.toggle("on", s.mode === "black");
    $("m-logo").classList.toggle("on", s.mode === "logo");
    const secs = sectionsOf(slides);
    let curSec = -1; secs.forEach((sec, k) => { if (sec.index <= i) curSec = k; });
    document.querySelectorAll("#secs button").forEach((b, k) => b.classList.toggle("cur", k === curSec));
  }

  function useDeck(id) {
    if (!id || id === deckId) return;
    deckId = id;
    if (unwatch) unwatch();
    unwatch = watchDeck(id, (deck) => {
      slides = deck ? expandItems(deck.items) : [];
      $("secs").innerHTML = sectionsOf(slides).map((s) => `<button data-i="${s.index}">${s.label.replace(/</g, "&lt;")}</button>`).join("");
      render();
    });
  }

  async function go(patch) {
    buzz();
    try { await live.update(patch); } catch (e) { alert(e.message); }
  }
  const step = (d) => go({ index: clamp((live.state.index || 0) + d, 0, Math.max(0, slides.length - 1)), mode: "slide" });
  const toggle = (m) => go({ mode: live.state.mode === m ? "slide" : m });

  live.onState((s) => { if (s.deckId) useDeck(s.deckId); render(); });
  live.onConnection((on) => {
    $("conn").className = "pill " + (on ? "ok" : "warn");
    $("conn").textContent = on ? "인터넷 연결됨" : "연결 끊김 · 다시 연결 중";
  });
  watchDisplayPresence((on) => {
    $("disp").className = "pill " + (on ? "ok" : "warn");
    $("disp").textContent = on ? "송출 화면 켜짐" : "송출 화면 꺼짐";
  });

  $("prev").onclick = () => step(-1);
  $("nextbtn").onclick = () => step(1);
  $("m-black").onclick = () => toggle("black");
  $("m-logo").onclick = () => toggle("logo");
  $("secs").onclick = (e) => { const b = e.target.closest("button"); if (b) go({ index: +b.dataset.i, mode: "slide" }); };
  keepAwake();
});
</script>
</body>
</html>
